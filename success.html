<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Status Verification | Alfa Media Digital Store</title>
    <meta name="description" content="Verify your digital order status and securely download the Online Business Blueprint Bundle." />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>

    <!-- Simple Top Navigation -->
    <header style="background: var(--color-pure-white); border-bottom: 1px solid var(--color-card-border); padding: 1rem 0;">
      <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
        <a href="/" class="brand-logo" aria-label="Return to Storefront">
          <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="14" fill="#0F3D1E"/>
            <path d="M14 34L24 12L34 34H28.5L26.5 29H21.5L19.5 34H14ZM22.8 25H25.2L24 20.8L22.8 25Z" fill="#C8F169"/>
            <circle cx="34" cy="14" r="3.5" fill="#C8F169"/>
          </svg>
          <span>Alfa Media</span>
        </a>
        <a href="/" class="text-link" style="color: var(--color-deep-green); font-size: 0.9rem;">
          &larr; Back to Store
        </a>
      </div>
    </header>

    <!-- Main Dynamic Order Status Container -->
    <main class="page-center-layout">
      <div class="container" id="order-status-root" style="display: flex; justify-content: center;">
        <!-- Populated dynamically and securely by assets/js/success.js -->
        <noscript>
          <div class="status-card">
            <h2 class="status-title">JavaScript Required</h2>
            <p class="status-subtitle">
              JavaScript is required to verify your payment and generate your secure download link. Please enable JavaScript in your browser settings.
            </p>
          </div>
        </noscript>
      </div>
    </main>

    <!-- Simple Footer -->
    <footer style="background: var(--color-deep-green); color: rgba(255,255,255,0.7); text-align: center; padding: 2rem 0; font-size: 0.85rem;">
      <div class="container">
        <p>&copy; 2026 Alfa Media Digital Store · Server-Verified Secure Delivery</p>
        <p style="margin-top: 0.5rem; font-size: 0.75rem; color: rgba(255,255,255,0.5);">
          Downloads stay locked until your payment is verified.
        </p>
      </div>
    </footer>

    <!-- Verification Script -->
    <script type="module">
      import { initOrderVerification } from '/assets/js/success.js';
      initOrderVerification();
    </script>
  </body>
</html>
