<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) | Alfa Media Digital Store</title>
    <meta name="robots" content="noindex, follow" />

    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>

    <header style="background: var(--color-pure-white); border-bottom: 1px solid var(--color-card-border); padding: 1rem 0;">
      <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
        <a href="/" class="brand-logo" aria-label="Return to Storefront">
          <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="14" fill="#0F3D1E"/>
            <path d="M14 34L24 12L34 34H28.5L26.5 29H21.5L19.5 34H14ZM22.8 25H25.2L24 20.8L22.8 25Z" fill="#C8F169"/>
            <circle cx="34" cy="14" r="3.5" fill="#C8F169"/>
          </svg>
          <span>Alfa Media</span>
        </a>
        <a href="/" class="text-link" style="color: var(--color-deep-green); font-size: 0.9rem;">
          &larr; Back to Store
        </a>
      </div>
    </header>

    <main class="page-center-layout">
      <div class="container" style="display: flex; justify-content: center;">
        <div class="status-card">
          <div class="status-icon" style="background: rgba(15, 61, 30, 0.1);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0F3D1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>

          <div class="pill-badge" style="background: var(--color-surface-grey); color: var(--color-forest); font-weight: 700;">
            ERROR 404
          </div>

          <h1 class="status-title" style="margin-top: 0.75rem;">Page Not Found</h1>
          <p class="status-subtitle">
            The page you requested could not be located. It may have moved or the address may have been typed incorrectly.
          </p>

          <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem;">
            <a href="/" class="btn btn-primary">
              <span>Return to Storefront</span>
              <span class="arrow-circle" aria-hidden="true">&rarr;</span>
            </a>
            <a href="/success.html?order_id=LOOKUP" class="btn btn-secondary">
              Track Order Status
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer style="background: var(--color-deep-green); color: rgba(255,255,255,0.7); text-align: center; padding: 2rem 0; font-size: 0.85rem;">
      <div class="container">
        <p>&copy; 2026 Alfa Media Digital Store</p>
      </div>
    </footer>

  </body>
</html>
