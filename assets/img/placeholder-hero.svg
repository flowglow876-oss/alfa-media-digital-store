<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a14"/>
      <stop offset="50%" stop-color="#0F3D1E"/>
      <stop offset="100%" stop-color="#061c0d"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#C8F169" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C8F169" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  <rect width="1200" height="700" fill="url(#limeGlow)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="500" y1="0" x2="500" y2="700"/>
    <line x1="700" y1="0" x2="700" y2="700"/>
    <line x1="900" y1="0" x2="900" y2="700"/>
    <line x1="1100" y1="0" x2="1100" y2="700"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Abstract Blueprint geometry -->
  <circle cx="850" cy="350" r="220" stroke="#C8F169" stroke-opacity="0.2" stroke-width="2" fill="none" stroke-dasharray="8 8"/>
  <circle cx="850" cy="350" r="140" stroke="#C8F169" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
  
  <!-- Stack of 7 Guides Mockup Representation -->
  <g transform="translate(680, 160)">
    <!-- Back card 3 -->
    <rect x="80" y="20" width="280" height="380" rx="20" fill="#144d27" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" transform="rotate(8 220 210)"/>
    <!-- Back card 2 -->
    <rect x="50" y="10" width="280" height="380" rx="20" fill="#195a2f" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" transform="rotate(3 190 200)"/>
    <!-- Front card -->
    <rect x="20" y="0" width="290" height="390" rx="22" fill="#0F3D1E" stroke="#C8F169" stroke-opacity="0.5" stroke-width="2.5" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.5))"/>
    
    <!-- Front Card Content -->
    <rect x="42" y="24" width="70" height="24" rx="12" fill="#C8F169"/>
    <text x="77" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F3D1E" text-anchor="middle">7 GUIDES</text>
    
    <text x="42" y="100" font-family="'Playfair Display', serif" font-style="italic" font-size="28" fill="#C8F169">Online Business</text>
    <text x="42" y="135" font-family="sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="-0.5">BLUEPRINT</text>
    
    <line x1="42" y1="160" x2="260" y2="160" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    
    <text x="42" y="195" font-family="sans-serif" font-size="12" fill="#C8F169" font-weight="600">COMPLETE 2026 EDITION</text>
    <text x="42" y="225" font-family="sans-serif" font-size="12" fill="#e2e8f0" opacity="0.8">01. AI UGC Ads &amp; Agency</text>
    <text x="42" y="250" font-family="sans-serif" font-size="12" fill="#e2e8f0" opacity="0.8">02. Digital Product Selling</text>
    <text x="42" y="275" font-family="sans-serif" font-size="12" fill="#e2e8f0" opacity="0.8">03. Website Selling &amp; Flipping</text>
    <text x="42" y="300" font-family="sans-serif" font-size="12" fill="#e2e8f0" opacity="0.8">04. Clipping Business Ops</text>
    <text x="42" y="325" font-family="sans-serif" font-size="12" fill="#e2e8f0" opacity="0.8">+ 3 More In-Depth Guides</text>
    
    <!-- Price Badge -->
    <rect x="42" y="345" width="246" height="32" rx="10" fill="#ffffff" fill-opacity="0.1"/>
    <text x="165" y="366" font-family="sans-serif" font-size="13" font-weight="bold" fill="#C8F169" text-anchor="middle">Instant Download · ₹399</text>
  </g>
</svg>
